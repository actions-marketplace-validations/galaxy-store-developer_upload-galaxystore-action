name: 'Upload to Samsung Galaxy Store'
description: 'Upload Android APK or AAB files to the Samsung Galaxy Store'
author: 'Cristian Lewczyk'

inputs:
  access-token:
    description: 'Galaxy Store API access token'
    required: true
  service-account-id:
    description: 'Galaxy Store service account ID'
    required: true
  content-id:
    description: '12-digit content ID of the app in the Galaxy Store'
    required: true
  package-path:
    description: 'Path to the .apk or .aab file to upload'
    required: true
  binary-seq-for-device-info:
    description: 'Sequence number of the device info configuration for the binary. Only set if your app requires a specific device configuration sequence.'
    required: false
  submit:
    description: 'Whether to submit the app for review after uploading'
    required: false
    default: 'false'
  staged-rollout:
    description: 'Whether to add the uploaded binary to a staged rollout group'
    required: false
    default: 'false'
  rollout-rate:
    description: 'Staged rollout percentage (0-100). Only used when staged-rollout is true.'
    required: false
    default: '0'

outputs:
  upload-result:
    description: 'JSON string containing the add binary API response'
  binary-seq:
    description: 'The binary sequence number of the uploaded binary (only set when staged-rollout is true)'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'upload-cloud'
  color: 'blue'
