name: 'Upload to Samsung Galaxy Store'
description: 'Upload Android APK or AAB files to the Samsung Galaxy Store'
author: 'Cristian Lewczyk'

inputs:
  access-token:
    description: 'Galaxy Store API access token'
    required: true
  service-account-id:
    description: 'Galaxy Store service account ID'
    required: true
  content-id:
    description: '12-digit content ID of the app in the Galaxy Store'
    required: true
  package-path:
    description: 'Path to the .apk or .aab file to upload'
    required: true
  binary-seq-for-device-info:
    description: 'binarySeq of an existing binary whose device configuration should be copied to the new binary. Obtain it from the binaryList in GET /seller/contentInfo. Only set if your app requires a specific device configuration.'
    required: false
  publication-type:
    description: 'When the app is published: 01 = automatically after review, 02 = on a scheduled date, 03 = manually by the seller'
    required: false
    default: '01'
  start-publication-date:
    description: 'Publication date in yyyy-MM-dd HH:mm:ss format. Required when publication-type is 02.'
    required: false
  submit:
    description: 'Whether to submit the app for review after uploading'
    required: false
    default: 'false'
  staged-rollout:
    description: 'Whether to add the uploaded binary to a staged rollout group'
    required: false
    default: 'false'
  rollout-rate:
    description: 'Staged rollout percentage as an integer from 1 to 100. Required when staged-rollout is true; ignored otherwise.'
    required: false
  disable-existing-rollout:
    description: 'When staged-rollout is true, disable any staged rollout that is still active (below 100%) on the LIVE version of the app before enabling the new one. Samsung requires this, but it changes the live app, so it is off by default.'
    required: false
    default: 'false'

outputs:
  upload-result:
    description: 'JSON string containing the add binary API response'
  binary-seq:
    description: 'The binary sequence number of the uploaded binary (only set when staged-rollout is true)'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'upload-cloud'
  color: 'blue'
