name: Test Galaxy Store Upload

on:
  workflow_dispatch: # manual trigger only

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy APK
        run: |
          echo "placeholder" > placeholder.txt
          zip dummy-app.apk placeholder.txt

      - name: Upload to Galaxy Store
        uses: ./
        with:
          access-token: ${{ secrets.GALAXY_ACCESS_TOKEN }}
          service-account-id: ${{ secrets.GALAXY_SERVICE_ACCOUNT_ID }}
          content-id: '123456789012'
          package-path: './dummy-app.apk'
