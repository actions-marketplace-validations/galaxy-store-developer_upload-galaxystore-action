name: Test Galaxy Store Upload

on:
  workflow_dispatch: # manual trigger only

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download test AAB
        run: gh release download v0.1-test-assets --pattern "app-release_v101.aab" --repo cristian-samsung/upload-galaxystore-action
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Galaxy Store
        id: upload
        uses: ./
        with:
          access-token: ${{ secrets.GALAXY_ACCESS_TOKEN }}
          service-account-id: ${{ secrets.GALAXY_SERVICE_ACCOUNT_ID }}
          content-id: ${{ vars.GALAXY_CONTENT_ID }}
          package-path: './app-release_v101.aab'
          staged-rollout: true
          rollout-rate: 10
          publication-type: '03'
          submit: true

      - name: Print binary seq
        if: steps.upload.outputs.binary-seq
        run: echo "Binary seq:" ${{ steps.upload.outputs.binary-seq }}
