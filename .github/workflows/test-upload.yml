name: Test Galaxy Store Upload

on:
  workflow_dispatch: # manual trigger only

jobs:
  upload:
    runs-on: code-linux
    steps:
      - uses: actions/checkout@v5

      # Expects a release tagged v0.1-test-assets in this repository containing app-release_v101.aab.
      # The host is derived from GITHUB_SERVER_URL so this works on github.com and GitHub Enterprise.
      - name: Download test AAB
        run: gh release download v0.1-test-assets --pattern "app-release_v101.aab" --repo "${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ENTERPRISE_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Galaxy Store
        id: upload
        uses: ./
        with:
          access-token: ${{ secrets.GALAXY_ACCESS_TOKEN }}
          service-account-id: ${{ secrets.GALAXY_SERVICE_ACCOUNT_ID }}
          content-id: ${{ vars.GALAXY_CONTENT_ID }}
          package-path: './app-release_v101.aab'
          staged-rollout: true
          rollout-rate: 10
          publication-type: '03'
          submit: false

      - name: Print binary seq
        if: steps.upload.outputs.binary-seq
        env:
          BINARY_SEQ: ${{ steps.upload.outputs.binary-seq }}
        run: echo "Binary seq: $BINARY_SEQ"
