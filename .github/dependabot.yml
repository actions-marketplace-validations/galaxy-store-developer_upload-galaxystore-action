version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @actions/core 3.x is ESM-only; this project compiles to CommonJS.
      - dependency-name: '@actions/core'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (native compiler) does not expose the compiler API ts-jest needs.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
